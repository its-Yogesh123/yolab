<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Typography — Inter (variable) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Razorpay Checkout SDK — required for payment modal -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- ── Primary SEO ── -->
    <title>YoLab — All-in-One Developer Utilities & SaaS Tools</title>
    <meta name="description" content="YoLab is a multi-service SaaS platform offering URL shortening, QR code generation, PDF analysis, and more — built for developers and teams who want fast, reliable tools in one place." />
    <meta name="keywords" content="URL shortener, QR code generator, PDF analyzer, developer tools, SaaS tools, link management, YoLab, Maester, online utilities" />
    <meta name="author" content="YoLab" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yolab.dev/" />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yolab.dev/" />
    <meta property="og:title" content="YoLab — All-in-One Developer Utilities & SaaS Tools" />
    <meta property="og:description" content="URL shortener, QR code generator, PDF analysis, and more — all in one unified platform built for developers." />
    <meta property="og:image" content="https://yolab.dev/og-image.png" />
    <meta property="og:site_name" content="YoLab" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@yolabdev" />
    <meta name="twitter:title" content="YoLab — All-in-One Developer Utilities & SaaS Tools" />
    <meta name="twitter:description" content="URL shortener, QR code generator, PDF analysis, and more — all in one unified platform built for developers." />
    <meta name="twitter:image" content="https://yolab.dev/og-image.png" />

    <!-- ── Theme & PWA ── -->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Structured Data (WebSite schema) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "YoLab",
      "url": "https://yolab.dev/",
      "description": "A multi-service SaaS platform offering URL shortening, QR code generation, PDF analysis, and developer utilities.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://yolab.dev/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
